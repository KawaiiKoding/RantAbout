<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RantAbout 🌧️</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #1a1a2e; color: #eee; max-width: 600px; margin: 0 auto; padding: 20px; }
    h1 { color: #a78bfa; }
    input, textarea, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: none; font-size: 14px; }
    input, textarea { background: #2a2a4a; color: #eee; }
    textarea { min-height: 90px; resize: vertical; }
    button { background: #6d4aff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #5937e6; }
    .dice-btn { width: auto !important; padding: 10px 14px !important; }
    .name-row { display: flex; gap: 8px; align-items: center; }
    .rant { background: #23233d; border-radius: 12px; padding: 14px; margin: 14px 0; }
    .rant .name { color: #a78bfa; font-weight: bold; }
    .rant .time { color: #888; font-size: 12px; margin-left: 8px; }
    .reply { background: #2c2c4f; border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 13px; }
    .reply .name { color: #7dd3fc; }
    .reply-btn { width: auto; padding: 4px 12px; background: #3a3a66; font-size: 12px; }
    .delete-btn { width: auto; padding: 4px 12px; background: #7f1d1d; font-size: 12px; float: right; }
  </style>
</head>
<body>
  <h1>🌧️ RantAbout your day!</h1>

  <div class="name-row">
    <input id="nameInput" type="text" maxlength="30" placeholder="Fake name (e.g. Invisible Otter)" />
    <button class="dice-btn" onclick="document.getElementById('nameInput').value = randomName()">🎲</button>
  </div>
  <textarea id="rantInput" maxlength="2000" placeholder="What happened today? Let it out..."></textarea>
  <button onclick="postRant()">Post it 📤</button>

  <div id="feed"></div>

  <script>
    const BLOB_URL = "https://textdb.dev/api/data/aeae041e-4a08-4524-bccb-4fae54766d34";

    let rants = [];

    async function loadFeed() {
      try {
        const res = await fetch(BLOB_URL + "?_=" + Date.now()); // cache-buster
        const raw = (await res.text()).trim();
        rants = raw.startsWith("[") ? JSON.parse(raw) : []; // ignore leftover junk like "hello world"
      } catch (err) {
        console.error("Load error:", err);
      }
      render();
    }

    async function save() {
      const res = await fetch(BLOB_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(rants)
      });
      if (!res.ok) alert(`SAVE FAILED: HTTP ${res.status}`);
    }

    async function postRant() {
      const name = document.getElementById("nameInput").value.trim();
      const text = document.getElementById("rantInput").value.trim();
      if (!name || !text) return alert("Give yourself a fake name and write something first!");

      await loadFeed();
      rants.unshift({ id: Date.now(), name, text, replies: [] });
      await save();
      document.getElementById("rantInput").value = "";
      render();
    }

    async function addReply(rantId, btn) {
      const box = btn.parentElement.querySelector(".reply-input");
      const text = box.value.trim();
      const name = document.getElementById("nameInput").value.trim() || "Anonymous";
      if (!text) return;

      await loadFeed();
      const rant = rants.find(r => r.id === rantId);
      if (!rant) return;

      rant.replies.push({ name, text, at: Date.now() });
      await save();
      render();
    }

    async function deleteRant(rantId) {
      await loadFeed();
      rants = rants.filter(r => r.id !== rantId);
      await save();
      render();
    }

    const ADJECTIVES = ["Invisible", "Nervous", "Grumpy", "Sleepy", "Feral", "Chaotic", "Silent", "Melancholy"];
    const NOUNS = ["Otter", "Penguin", "Raccoon", "Toast", "Cactus", "Ghost", "Duck", "Moth", "Waffle", "Goblin"];

    function randomName() {
      const a = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      return `${a} ${n}`;
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const feed = document.getElementById("feed");
      if (rants.length === 0) {
        feed.innerHTML = "<p style='color:#666'>Nobody's ranted yet. Be the first to unleash! 👀</p>";
        return;
      }

      feed.innerHTML = rants.map(r => `
        <div class="rant">
          <span class="name">🫥 ${escapeHTML(r.name)}</span>
          <span class="time">${timeAgo(r.at ?? r.id)}</span>
          <p>${escapeHTML(r.text)}</p>
          ${r.replies.map(rp => `
            <div class="reply">
              <span class="name">💬 ${escapeHTML(rp.name)}</span>: ${escapeHTML(rp.text)}
            </div>`).join("")}
          <input class="reply-input" placeholder="Reply to this..." />
          <button class="reply-btn" onclick="addReply(${r.id}, this)">Reply</button>
          <button class="delete-btn" onclick="deleteRant(${r.id})">🗑️</button>
        </div>
      `).join("");
    }

    loadFeed();
    setInterval(loadFeed, 5000);
  </script>
</body>
</html>
